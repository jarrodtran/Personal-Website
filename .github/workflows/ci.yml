name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:redirects
      - run: pnpm test:titles
      - run: pnpm test:tap
      - run: pnpm test:images
      - run: pnpm test:theme
      - run: pnpm a11y
      - run: pnpm size
      - run: pnpm build
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:redirects
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:titles
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm a11y
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm size
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:theme
        env:
          BASE_PATH: /Personal-Website
