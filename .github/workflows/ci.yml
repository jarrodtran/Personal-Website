name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: npx playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:banned
      - run: pnpm test:redirects
      - run: pnpm test:titles
      - run: pnpm test:robots
      - run: pnpm test:tap
      - run: pnpm test:writing-output
      - run: pnpm test:height
      - run: pnpm test:images
      - run: pnpm test:theme
      - run: pnpm test:tokens
      - run: pnpm a11y
      - run: pnpm size
      - run: pnpm build
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:banned
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:redirects
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:titles
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:robots
      - run: pnpm a11y
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm size
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:theme
        env:
          BASE_PATH: /Personal-Website
