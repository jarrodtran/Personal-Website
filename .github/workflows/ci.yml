name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm build
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:banned
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:redirects
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:titles
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:robots
      - run: pnpm a11y
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm size
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:theme
        env:
          BASE_PATH: /Personal-Website
      - run: pnpm test:theme-toggle
        env:
          BASE_PATH: /Personal-Website
