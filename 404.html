<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found | Jarrod Tran</title>
    <link rel="icon" href="/favicon.png">
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #11120f;
        --muted: #6a6b65;
        --signal: #1257ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 34rem; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--signal);
        font-size: .72rem;
        font-weight: 500;
      }
      h1 {
        letter-spacing: -.04em;
        margin: 1rem 0 1.1rem;
        font-size: clamp(2.1rem, 6vw, 3.2rem);
        font-weight: 500;
        line-height: 1;
      }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 2rem; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        padding: .25rem 1.2rem;
        background: var(--signal);
        color: #fff;
        text-decoration: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .68rem;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      a:hover { filter: brightness(.92); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 / Page not found</p>
      <h1>This path does not exist.</h1>
      <p>The operating system is intact. Return to the main site to continue.</p>
      <a href="/">Back to jarrodtran.com</a>
    </main>
  </body>
</html>
