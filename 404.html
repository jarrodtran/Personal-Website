<!DOCTYPE html>

  <title>Page not found | Jarrod Tran</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .missing {
      min-height: calc(100svh - 4.5rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 10vw, 8rem) var(--pad);
    }
    .missing-copy { max-width: 36rem; }
    .missing-copy h1 {
      margin: 1.35rem 0 1.15rem;
      font-size: clamp(2.6rem, 7vw, 4.8rem);
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: .94;
    }
    .missing-copy p {
      margin: 0 0 1.75rem;
      color: var(--slate);
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

    <a class="wordmark" href="/" aria-label="Jarrod Tran, home">Jarrod Tran</a>
    <nav aria-label="Primary navigation">
      <a href="/#work">Work</a>
      <a href="/#experience">Experience</a>
      <a href="/#contact">Contact</a>
    </nav>
    <a class="header-contact" href="/">Home <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" class="missing">
    <div class="missing-copy">
      <p class="section-index">Page not found</p>
      <h1>This page isn’t <em>here.</em></h1>
      <p>The rest of the site is. Head home.</p>
      <a class="primary-action" href="/">Back to jarrodtran.com <span aria-hidden="true">↗</span></a>
    </div>

</html>
